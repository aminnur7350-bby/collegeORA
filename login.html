<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CollegeMate</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">🎓 CollegeMate</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="signup.html">Signup</a>
    </nav>
</header>

<section class="hero">

    <div>

        <h1>Login 🔐</h1>

        <p>
            Login to access your CollegeMate dashboard.
        </p>

        <br>

        <input type="email" placeholder="Email"
               style="padding:14px;width:300px;border-radius:8px;border:1px solid #ccc;"><br><br>

        <input type="password" placeholder="Password"
               style="padding:14px;width:300px;border-radius:8px;border:1px solid #ccc;"><br><br>

        <button class="btn" onclick="loginDemo()">
            Login
        </button>

        <p id="message"></p>

        <br>

        <a href="signup.html">Don't have an account? Signup</a>

    </div>

</section>

<script>
function loginDemo() {
    document.getElementById("message").innerText =
        "Firebase login will be connected in the next step.";
}
</script>

</body>
</html>
